<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEN SPORTS</title><meta name="description" content="GEN SPORTS. ALL SPORTS. ONE PLATFORM.">
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')</script>
<script src="config.js"></script>
</head>
<body>
<header class="hd"><div class="in">
<a class="brand" href="#/" aria-label="GEN SPORTS home"><img src="assets/logo.png" alt="GEN SPORTS"></a>
<form class="sf" id="sf"><input id="q" type="search" placeholder="Search…" aria-label="Search"></form>
<button id="th" class="ib" aria-label="Toggle dark or light theme">◐</button></div>
<nav class="nv" id="nv" aria-label="Main"></nav></header>
<div id="pvb" class="pvb" hidden>Preview mode: drafts are visible only while you are signed in to admin.</div>
<main id="app"></main>
<footer class="ft" id="ft"></footer>
<script>
const $=s=>document.querySelector(s);
const h=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=u=>/^(https?:|mailto:|#|\/)/i.test(u||'')?u:'#';
(()=>{let m='';
 if(typeof supabase==='undefined')m='Supabase library load nathi thayi. Internet check karo, pachhi page refresh karo.';
 else if(typeof GEN==='undefined')m='config.js male nathi. config.js file index.html/admin.html jevi j folder ma hovi joiye.';
 else if(/YOUR-/.test(GEN.url+GEN.key)||!GEN.url||!GEN.key)m='config.js ma Supabase Project URL ane anon public key paste karo (hajiy YOUR-... lakhelu chhe).';
 if(m){document.body.insertAdjacentHTML('afterbegin','<div style="padding:24px;max-width:560px;margin:8vh auto;border:1px solid #ff6b6b;border-radius:12px;color:#fff;background:#1b0d12;font:16px/1.5 system-ui"><b>Setup needed</b><p>'+m+'</p></div>');throw new Error(m)}})();
const sb=supabase.createClient(GEN.url,GEN.key);
let S={},P=[],N=[],PV=false;
try{const t=localStorage.getItem('gs-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#th').onclick=()=>{const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('gs-theme',t)}catch(e){}};
$('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/s?q='+encodeURIComponent($('#q').value.trim())};

const fmtDate=v=>{const d=new Date(v);return isNaN(d)?h(v):d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})};
const val=(f,v)=>v==null||v===''?'':f.type==='url'?`<a href="${h(safe(v))}" target="_blank" rel="noopener">${h(String(v).replace(/^https?:\/\//,''))}</a>`:f.type==='date'?fmtDate(v):f.type==='status'?`<span class="badge">${h(v)}</span>`:f.type==='longtext'?`<span class="pre">${h(v)}</span>`:h(v);
const EMPTY='<div class="empty"><h3>Nothing published yet</h3><p>New sports and updates will appear here soon.</p></div>';
const ad=()=>S.ads!=='on'?'':S.adsense_client?`<div class="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="${h(S.adsense_client)}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`:'<div class="ad">Ad space</div>';
function adsInit(){
 if(S.ads!=='on'||!S.adsense_client)return;
 if(!document.getElementById('ags')){const s=document.createElement('script');s.id='ags';s.async=true;s.crossOrigin='anonymous';s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+encodeURIComponent(S.adsense_client);document.head.appendChild(s)}
 document.querySelectorAll('ins.adsbygoogle:not([data-done])').forEach(i=>{i.dataset.done=1;try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}});
}

async function load(){
 const [s,p,n]=await Promise.all([sb.from('settings').select('*'),sb.from('pages').select('*').order('sort'),sb.from('nav_items').select('*').order('sort')]);
 if(s.error)throw s.error;if(p.error)throw p.error;
 S={};(s.data||[]).forEach(r=>S[r.key]=r.value);
 P=(p.data||[]).filter(x=>PV||(x.status==='published'&&x.visible));
 N=(n.data||[]).filter(x=>PV||x.visible);
 document.title=S.site_name||'GEN SPORTS';
}
function chrome(){
 $('#nv').innerHTML=['<a href="#/">Home</a>',...P.filter(x=>x.kind==='sport'&&!x.parent_id).map(x=>`<a href="#/p/${h(x.slug)}">${h(x.title)}</a>`),...N.map(x=>`<a href="${h(safe(x.url))}">${h(x.label)}</a>`)].join('');
 $('#ft').innerHTML=`<div class="in"><img class="flogo" src="assets/logo.png" alt="GEN SPORTS"><p class="tag">${h(S.tagline||'ALL SPORTS. ONE PLATFORM.')}</p><nav class="fl" aria-label="Footer">${P.filter(x=>x.kind==='legal').map(x=>`<a href="#/p/${h(x.slug)}">${h(x.title)}</a>`).join('')}</nav><p class="mu">${h(S.footer_text||'')} © ${new Date().getFullYear()} ${h(S.site_name||'GEN SPORTS')}</p></div>`;
 $('#pvb').hidden=!PV;
}
function renderSec(s){
 const F=[...(s.section_fields||[])].sort((a,b)=>a.sort-b.sort),T=s.display_type,f0=F[0];
 const R=[...(s.records||[])].filter(r=>PV||r.status==='published').sort((a,b)=>a.sort-b.sort);
 if(T==='news')R.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 const v=(r,f)=>val(f,r.data[f.key]);
 const rest=(r,fs)=>fs.map(f=>r.data[f.key]?`<div class="kv"><span>${h(f.label)}</span><b>${v(r,f)}</b></div>`:'').join('');
 const title=r=>f0&&r.data[f0.key]?`<h3>${v(r,f0)}</h3>`:'';
 let b='';
 if(T==='table')b=`<div class="tw"><table><thead><tr>${F.map(f=>`<th>${h(f.label)}</th>`).join('')}</tr></thead><tbody>${R.map(r=>`<tr>${F.map(f=>`<td>${v(r,f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 else if(T==='list')b=`<ul class="ls">${R.map(r=>`<li><b>${f0?v(r,f0):''}</b> <span class="mu">${F.slice(1).map(f=>v(r,f)).filter(Boolean).join(' · ')}</span></li>`).join('')}</ul>`;
 else if(T==='stats')b=`<div class="grid">${R.map(r=>{const f=F[1]||f0;return f?`<div class="card"><div class="big">${v(r,f)}</div><div class="mu">${F[1]?v(r,f0):''}</div></div>`:''}).join('')}</div>`;
 else if(T==='announcement')b=R.map(r=>`<div class="ann">${title(r)}${rest(r,F.slice(1))}</div>`).join('');
 else if(T==='text')b=R.map(r=>`<div class="prose">${F.map(f=>r.data[f.key]?`<p>${f===f0&&F.length>1?`<b>${v(r,f)}</b>`:v(r,f)}</p>`:'').join('')}</div>`).join('');
 else if(T==='category')b=`<div class="chips">${R.map(r=>{const u=F.find(f=>f.type==='url'&&r.data[f.key]),t=h(r.data[f0?.key]||'');return u?`<a class="chip" href="${h(safe(r.data[u.key]))}">${t}</a>`:`<span class="chip">${t}</span>`}).join('')}</div>`;
 else b=`<div class="grid">${R.map(r=>`<div class="card">${title(r)}${T==='news'?`<small>${fmtDate(r.created_at)}</small>`:''}${rest(r,F.slice(1))}</div>`).join('')}</div>`;
 if(!R.length&&!s.description&&!PV)return '';
 return `<section class="sec"><h2>${h(s.title)}</h2>${s.description?`<p class="prose mu">${h(s.description)}</p>`:''}${R.length?b:(PV?'<p class="mu">No published entries yet.</p>':'')}</section>`;
}
async function secs(pg){
 const r=await sb.from('sections').select('*,section_fields(*),records(*)').eq('page_id',pg.id).order('sort');
 if(r.error)throw r.error;
 const L=(r.data||[]).filter(s=>PV||(s.status==='published'&&s.visible));
 return L.map((s,i)=>renderSec(s)+(i===1?ad():'')).join('')+(L.length?ad():'');
}
const card=p=>`<a class="card" href="#/p/${h(p.slug)}"><h3>${h(p.title)}</h3><p class="mu">${h((p.description||'').slice(0,110))}</p></a>`;
const recs=async(n)=>{const r=await sb.from('records').select('*,sections(title,page_id)').order('created_at',{ascending:false}).limit(n);return (r.data||[]).filter(x=>(PV||x.status==='published')&&P.some(p=>p.id===x.sections?.page_id))};
const summary=r=>Object.values(r.data||{}).filter(Boolean).join(' · ');
const link=r=>{const p=P.find(p=>p.id===r.sections?.page_id);return `<li><a href="#/p/${h(p.slug)}">${h(summary(r)||'(entry)')}</a> <small>${h(p.title)} › ${h(r.sections.title)} · ${fmtDate(r.created_at)}</small></li>`};

async function viewHome(){
 const sp=P.filter(x=>x.kind==='sport'&&!x.parent_id),home=P.find(x=>x.slug==='home');
 const [up,hs]=await Promise.all([recs(40),home?secs(home):'']);
 $('#app').innerHTML=`<section class="hero"><div class="in"><img class="hlogo" src="assets/logo.png" alt="GEN SPORTS"><p class="tag">${h(S.tagline||'ALL SPORTS. ONE PLATFORM.')}</p></div></section>
 <div class="in"><section class="sec"><h2>Sports</h2>${sp.length?`<div class="grid">${sp.map(card).join('')}</div>`:EMPTY}</section>${hs}
 ${up.length?`<section class="sec"><h2>Latest updates</h2><ul class="ls">${up.slice(0,8).map(link).join('')}</ul></section>`:''}</div>`;
}
async function viewPage(slug){
 const pg=P.find(x=>x.slug===slug);
 if(!pg){$('#app').innerHTML='<div class="in"><div class="empty"><h3>Page not found</h3><a href="#/">Back to home</a></div></div>';return}
 document.title=pg.title+' | '+(S.site_name||'GEN SPORTS');
 const kids=P.filter(x=>x.parent_id===pg.id),par=P.find(x=>x.id===pg.parent_id),body=await secs(pg);
 $('#app').innerHTML=`<div class="in page"><nav class="crumb"><a href="#/">Home</a>${par?` / <a href="#/p/${h(par.slug)}">${h(par.title)}</a>`:''}</nav><h1>${h(pg.title)}</h1>${pg.description?`<p class="prose lead">${h(pg.description)}</p>`:''}${kids.length?`<div class="chips">${kids.map(k=>`<a class="chip" href="#/p/${h(k.slug)}">${h(k.title)}</a>`).join('')}</div>`:''}${body||(pg.description?'':EMPTY)}</div>`;
}
async function viewSearch(q){
 const t=q.toLowerCase(),pg=t?P.filter(p=>(p.title+' '+(p.description||'')).toLowerCase().includes(t)):[];
 const rs=t?(await recs(1000)).filter(r=>JSON.stringify(r.data).toLowerCase().includes(t)):[];
 $('#app').innerHTML=`<div class="in page"><h1>Search</h1><p class="mu">${t?`Results for “${h(q)}”`:'Type something in the search box.'}</p>
 ${pg.length?`<h2>Pages</h2><div class="grid">${pg.map(card).join('')}</div>`:''}
 ${rs.length?`<h2>Entries</h2><ul class="ls">${rs.map(link).join('')}</ul>`:''}
 ${t&&!pg.length&&!rs.length?'<div class="empty">No results found.</div>':''}</div>`;
}
async function route(){
 const [path,qs]=(location.hash.slice(1)||'/').split('?'),q=new URLSearchParams(qs||'');
 PV=q.get('preview')==='1';
 $('#app').innerHTML='<p class="mu in" style="padding-block:2rem">Loading…</p>';
 try{
  await load();chrome();
  if(path.startsWith('/p/'))await viewPage(decodeURIComponent(path.slice(3)));
  else if(path==='/s')await viewSearch(q.get('q')||'');
  else await viewHome();
 }catch(e){$('#app').innerHTML=`<div class="in"><div class="empty"><h3>Setup needed</h3><p>${h(e.message||e)}</p><p>Check config.js and that supabase/schema.sql has been run.</p></div></div>`}
 scrollTo(0,0);adsInit();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
